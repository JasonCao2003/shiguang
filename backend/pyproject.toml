[project]
name = "find-backend"
version = "0.1.0"
description = "Find — 校园失物招领平台后端（FastAPI + LangGraph）"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    # Config / validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    # DB
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "pgvector>=0.2.5",
    "alembic>=1.13",
    # Agents
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0",
    # LLM（DeepSeek 兼容 OpenAI）
    "openai>=1.40",
    # Infra
    "redis>=5.0",
    "arq>=0.26",
    "boto3>=1.34",
    "httpx>=0.27",
    # Auth
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    # Observability
    "langfuse>=2.50",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI 依赖注入需在默认参数调用 Depends()
    "UP042",  # 允许 class X(str, enum.Enum)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
