[project]
name = "find-embedding-service"
version = "0.1.0"
description = "BGE-M3 向量化服务（DeepSeek 无 embedding 接口）"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sentence-transformers>=3.0",
    "torch>=2.2",
]

# 作为非打包项目运行（服务入口就是根目录下的 server.py）
[tool.uv]
package = false

# 使用 CPU-only 的 PyTorch 索引，避免拉取 2~3GB 的 CUDA 依赖
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
